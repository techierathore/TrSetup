<!DOCTYPE html>
<!-- DEBUG-ONLY host document. Byte-for-byte index.html plus the automation-ids script tag at the
     bottom; keep the two in sync when editing either. MainPage points BlazorWebView here under
     #if DEBUG, and TrSetup.csproj drops this file from Release builds entirely. The WHY lives in
     the AUTOMATION-ID MIRROR GATE comment in TrSetup.csproj. -->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TrSetup</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="TrSetup.styles.css" />
    <link rel="stylesheet" href="_content/TrSetupUI/css/theme.css" />
    <link rel="stylesheet" href="_content/TrBlazeUI.Components/trblazeui.css" />
    <link rel="stylesheet" href="_content/TrSetupUI/css/trsetup.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <!-- Mirrors data-testid -> aria-placeholder so XCUITest/Appium can locate Blazor controls
         inside the WKWebView (REQ-FN-030). See the file header of automation-ids.js for the
         attribute experiment, and TrSetup.csproj for why it is Debug-only. -->
    <script src="_content/TrSetupUI/js/automation-ids.js"></script>

</body>

</html>
